<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#0d0d0d">
    <title>Lift</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface2: #252525;
            --accent: #c8f05a;
            --accent-dim: rgba(200, 240, 90, 0.1);
            --text: #f0f0f0;
            --text2: #888;
            --text3: #4a4a4a;
            --border: #2a2a2a;
            --red: #ff6b6b;
            --sb: env(safe-area-inset-bottom, 0px);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
            min-height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 100;
            padding-bottom: var(--sb);
        }

        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 10px 8px;
            background: none;
            border: none;
            color: var(--text3);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.15s;
            letter-spacing: 0.3px;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-icon { font-size: 20px; line-height: 1; }

        /* PAGES */
        .page { display: none; padding-bottom: calc(80px + var(--sb)); min-height: 100vh; }
        .page.active { display: block; }

        /* SHARED */
        .page-header { padding: 52px 20px 20px; }
        .page-title { font-size: 30px; font-weight: 800; letter-spacing: -0.8px; }
        .page-subtitle { font-size: 14px; color: var(--text2); margin-top: 4px; }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text3);
            font-weight: 700;
            padding: 20px 20px 10px;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            margin: 0 16px 10px;
            border: 1px solid var(--border);
        }

        /* HOME */
        .acct-card {
            background: var(--accent);
            margin: 0 16px 10px;
            border-radius: 20px;
            padding: 20px 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .acct-num { font-size: 72px; font-weight: 900; color: #0d0d0d; line-height: 1; letter-spacing: -3px; }
        .acct-label { font-size: 13px; font-weight: 700; color: rgba(0,0,0,0.55); margin-top: 4px; }
        .acct-right { text-align: right; padding-bottom: 4px; }
        .acct-month-num { font-size: 40px; font-weight: 900; color: rgba(0,0,0,0.35); line-height: 1; letter-spacing: -1.5px; }
        .acct-month-label { font-size: 11px; font-weight: 700; color: rgba(0,0,0,0.35); text-transform: uppercase; letter-spacing: 0.5px; }

        .big-btn {
            display: block;
            width: calc(100% - 32px);
            margin: 0 16px 10px;
            padding: 18px;
            background: var(--accent);
            color: #0d0d0d;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: -0.3px;
            text-align: center;
        }

        .week-row { display: flex; gap: 5px; padding: 14px 14px; }
        .week-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .wdn { font-size: 10px; color: var(--text3); font-weight: 700; text-transform: uppercase; }
        .wdd {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--surface2); border: 1.5px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: var(--text3);
        }
        .wdd.hit { background: var(--accent); color: #0d0d0d; border-color: var(--accent); font-weight: 800; }
        .wdd.today-ring { border-color: var(--accent); color: var(--text); }
        .wdd.hit.today-ring { background: var(--accent); color: #0d0d0d; }

        .workout-row {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-top: 1px solid var(--border);
        }
        .workout-row:first-child { border-top: none; }
        .workout-row:active { background: var(--surface2); }
        .wr-group { font-size: 16px; font-weight: 700; }
        .wr-date { font-size: 13px; color: var(--text2); margin-top: 2px; }
        .wr-detail { font-size: 12px; color: var(--text3); margin-top: 2px; }
        .wr-arrow { color: var(--text3); font-size: 18px; }

        .muscle-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px; vertical-align: middle;
        }

        /* LOG PAGE */
        .log-header {
            padding: 52px 20px 8px;
            display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
        }
        .hdr-mid { flex: 1; min-width: 0; }
        .hdr-cancel {
            background: none; border: none; color: var(--text2);
            font-size: 15px; cursor: pointer; padding: 6px 0; flex-shrink: 0;
        }
        .hdr-save {
            background: none; border: none; color: var(--accent);
            font-size: 15px; font-weight: 800; cursor: pointer; padding: 6px 0; flex-shrink: 0;
        }

        .date-row {
            display: flex; align-items: center; gap: 10px;
            padding: 0 16px 16px;
        }
        .date-row-label { font-size: 14px; color: var(--text2); flex-shrink: 0; }
        .date-input {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); font-size: 14px; padding: 9px 12px;
            color-scheme: dark;
        }
        .date-input:focus { outline: none; border-color: var(--accent); }

        /* Muscle tiles */
        .muscle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
        .muscle-tile {
            background: var(--surface); border: 2px solid var(--border);
            border-radius: 18px; padding: 18px 16px; cursor: pointer;
            transition: transform 0.1s;
        }
        .muscle-tile:active { transform: scale(0.97); border-color: var(--accent); background: var(--accent-dim); }
        .mt-bar { height: 4px; border-radius: 2px; width: 36px; margin-bottom: 10px; }
        .mt-name { font-size: 17px; font-weight: 800; }
        .mt-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }

        .bar-chest { background: #ff6b6b; }
        .bar-lats  { background: #6badff; }
        .bar-legs  { background: #c8f05a; }
        .bar-arms  { background: #ffb26b; }
        .bar-shoulders { background: #b26bff; }

        /* Exercise cards */
        .ex-card {
            background: var(--surface); border-radius: 16px;
            margin: 0 16px 10px; border: 1px solid var(--border); overflow: hidden;
        }
        .ec-header {
            padding: 13px 14px; display: flex;
            justify-content: space-between; align-items: center;
        }
        .ec-name { font-size: 15px; font-weight: 700; }
        .ec-remove {
            background: none; border: none; color: var(--text3);
            font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1;
            min-width: 36px; min-height: 36px; display: flex; align-items: center; justify-content: center;
        }

        .sets-head {
            display: flex; border-top: 1px solid var(--border);
            padding: 5px 14px; align-items: center;
        }
        .sh { font-size: 10px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .sh-num { width: 28px; flex-shrink: 0; }
        .sh-w { flex: 1; text-align: center; }
        .sh-x { padding: 0 8px; color: transparent; font-size: 14px; }
        .sh-r { flex: 1; text-align: center; }
        .sh-del { width: 40px; }

        .set-row {
            display: flex; align-items: center; padding: 5px 14px;
            border-top: 1px solid var(--border); gap: 4px;
        }
        .set-num { width: 28px; flex-shrink: 0; font-size: 13px; color: var(--text3); }
        .set-inp {
            flex: 1; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 17px; font-weight: 700;
            padding: 9px 4px; text-align: center; min-width: 0;
            -moz-appearance: textfield;
        }
        .set-inp:focus { outline: none; border-color: var(--accent); }
        .set-inp::-webkit-outer-spin-button,
        .set-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
        .set-inp::placeholder { color: var(--text3); font-weight: 400; font-size: 13px; }
        .set-times { font-size: 14px; color: var(--text3); padding: 0 3px; flex-shrink: 0; }
        .set-del {
            width: 40px; flex-shrink: 0; background: none; border: none;
            color: var(--text3); font-size: 20px; cursor: pointer; text-align: center;
            min-height: 36px; display: flex; align-items: center; justify-content: center;
        }
        .set-del:active { color: var(--red); }

        .add-set-row { padding: 8px 14px; border-top: 1px solid var(--border); }
        .add-set-btn {
            width: 100%; padding: 9px; background: none;
            border: 1px dashed var(--border); border-radius: 8px;
            color: var(--text3); font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .add-set-btn:active { background: var(--surface2); }

        .add-ex-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: calc(100% - 32px); margin: 0 16px 10px;
            padding: 15px; background: none;
            border: 2px dashed var(--border); border-radius: 16px;
            color: var(--text2); font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .add-ex-btn:active { background: var(--surface); }

        /* MODAL EDIT BUTTON */
        .modal-edit-btn {
            display: block; width: calc(100% - 40px); margin: 0 20px 8px;
            padding: 12px; background: var(--accent-dim);
            border: 1px solid rgba(200,240,90,0.25); border-radius: 12px;
            color: var(--accent); font-size: 14px; font-weight: 700; cursor: pointer;
        }

        /* SHEETS */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            z-index: 300; display: none; align-items: flex-end; justify-content: center;
        }
        .sheet-overlay.open { display: flex; }

        .sheet {
            background: var(--surface); border-radius: 24px 24px 0 0;
            width: 100%; max-width: 430px; max-height: 78vh;
            overflow-y: auto; padding-bottom: calc(20px + var(--sb));
        }

        .sheet-handle { width: 36px; height: 4px; background: var(--text3); border-radius: 2px; margin: 12px auto 0; }
        .sheet-title { font-size: 18px; font-weight: 800; padding: 16px 20px 14px; border-bottom: 1px solid var(--border); }
        .sheet-section { padding: 14px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); font-weight: 700; }

        .custom-row { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .custom-input {
            flex: 1; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); font-size: 15px; padding: 11px 14px; min-width: 0;
        }
        .custom-input:focus { outline: none; border-color: var(--accent); }
        .custom-add {
            background: var(--accent); border: none; border-radius: 10px;
            color: #0d0d0d; font-weight: 800; font-size: 15px; padding: 11px 18px;
            cursor: pointer; flex-shrink: 0;
        }

        .picker-btn {
            width: 100%; padding: 14px 16px; background: none;
            border: none; border-top: 1px solid var(--border);
            color: var(--text); font-size: 15px; cursor: pointer; text-align: left;
            display: flex; justify-content: space-between; align-items: center;
        }
        .picker-btn:active { background: var(--surface2); }
        .picker-plus { color: var(--accent); font-size: 22px; }

        /* MODAL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            z-index: 200; display: none; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface); border-radius: 24px 24px 0 0;
            width: 100%; max-width: 430px; max-height: 82vh;
            overflow-y: auto; padding-bottom: calc(24px + var(--sb));
        }

        .modal-handle { width: 36px; height: 4px; background: var(--text3); border-radius: 2px; margin: 12px auto 0; }
        .modal-head { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); }
        .modal-title { font-size: 20px; font-weight: 800; }
        .modal-date { font-size: 14px; color: var(--text2); margin-top: 3px; }

        .modal-ex { padding: 14px 20px; border-top: 1px solid var(--border); }
        .modal-ex:first-of-type { border-top: none; }
        .me-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        .me-set { display: flex; gap: 8px; font-size: 14px; padding: 5px 0; border-bottom: 1px solid var(--border); }
        .me-set:last-child { border-bottom: none; }
        .me-sn { color: var(--text3); font-size: 13px; width: 36px; flex-shrink: 0; }
        .me-sd { font-weight: 600; color: var(--text); }

        .modal-del {
            width: calc(100% - 40px); margin: 8px 20px 0;
            padding: 12px; background: none;
            border: 1px solid rgba(255,107,107,0.3); border-radius: 12px;
            color: var(--red); font-size: 14px; cursor: pointer;
        }

        /* GROUP PILLS */
        .group-pills {
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 0 20px 16px; align-items: center;
        }
        .group-pill {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 10px 5px 8px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 20px; font-size: 13px; font-weight: 600;
        }
        .gp-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .add-group-pill {
            padding: 5px 10px; background: none;
            border: 1px dashed var(--border); border-radius: 20px;
            color: var(--text3); font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .add-group-pill:active { background: var(--surface2); }

        /* HISTORY */
        .cal-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px 16px;
        }
        .cal-month { font-size: 20px; font-weight: 800; }
        .cal-arrow {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); width: 38px; height: 38px;
            font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .cal-heads { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 16px; gap: 3px; margin-bottom: 3px; }
        .cal-head { text-align: center; font-size: 11px; color: var(--text3); font-weight: 700; padding: 3px 0; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 16px; gap: 3px; }
        .cal-cell {
            aspect-ratio: 1; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; color: var(--text3);
        }
        .cal-cell.has-workout { background: var(--accent); color: #0d0d0d; font-weight: 800; cursor: pointer; }
        .cal-cell.has-workout:active { opacity: 0.75; }
        .cal-cell.is-today { border: 1.5px solid var(--accent); color: var(--text); }
        .cal-cell.is-today.has-workout { background: var(--accent); color: #0d0d0d; }

        /* SNACKBAR */
        .snackbar {
            position: fixed; bottom: calc(72px + var(--sb));
            left: 50%; transform: translateX(-50%) translateY(8px);
            background: #2a2a2a; color: var(--text); padding: 12px 20px;
            border-radius: 12px; font-size: 14px; font-weight: 600;
            opacity: 0; transition: opacity 0.2s, transform 0.2s;
            pointer-events: none; z-index: 500; white-space: nowrap;
            border: 1px solid var(--border);
        }
        .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* EMPTY STATE */
        .empty { padding: 36px 20px; text-align: center; }
        .empty-title { font-size: 16px; font-weight: 700; color: var(--text2); margin-bottom: 5px; }
        .empty-sub { font-size: 13px; color: var(--text3); }
    </style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="page-home" class="page active">
    <div class="page-header">
        <div class="page-title">Lift</div>
        <div class="page-subtitle" id="home-date"></div>
    </div>

    <div class="acct-card">
        <div>
            <div class="acct-num" id="days-num">—</div>
            <div class="acct-label" id="days-label">no lifts yet</div>
        </div>
        <div class="acct-right">
            <div class="acct-month-num" id="month-num">0</div>
            <div class="acct-month-label" id="month-label">this month</div>
        </div>
    </div>

    <div class="section-label">This Week</div>
    <div class="card" style="padding:0">
        <div class="week-row" id="week-row"></div>
    </div>

    <button class="big-btn" id="home-log-btn" onclick="goToLog()">+ Log Today's Workout</button>

    <div class="section-label">Recent</div>
    <div class="card" style="padding:0" id="recent-list"></div>
</div>

<!-- ===== LOG ===== -->
<div id="page-log" class="page">

    <!-- Step A: pick muscle group -->
    <div id="log-step-a">
        <div class="page-header">
            <div class="page-title">New Workout</div>
            <div class="page-subtitle">What are you training today?</div>
        </div>
        <div class="date-row">
            <span class="date-row-label">Date</span>
            <input type="date" class="date-input" id="workout-date">
        </div>
        <div class="muscle-grid" id="muscle-grid"></div>
    </div>

    <!-- Step B: log exercises -->
    <div id="log-step-b" style="display:none">
        <div class="log-header">
            <button class="hdr-cancel" id="hdr-cancel-btn" onclick="cancelLog()">← Back</button>
            <div class="hdr-mid">
                <div class="page-title" id="log-title">Chest Day</div>
                <div class="page-subtitle" id="log-subtitle"></div>
            </div>
            <button class="hdr-save" id="hdr-save-btn" onclick="finishWorkout()">Save</button>
        </div>

        <div id="group-pills"></div>

        <div id="ex-cards"></div>

        <button class="add-ex-btn" onclick="openPicker()">
            <span style="font-size:20px;line-height:1">+</span> Add Exercise
        </button>
    </div>
</div>

<!-- ===== HISTORY ===== -->
<div id="page-history" class="page">
    <div class="page-header">
        <div class="page-title">History</div>
        <div class="page-subtitle">Your lift log</div>
    </div>

    <div class="cal-nav">
        <button class="cal-arrow" onclick="shiftMonth(-1)">‹</button>
        <div class="cal-month" id="cal-label">May 2026</div>
        <button class="cal-arrow" onclick="shiftMonth(1)">›</button>
    </div>

    <div class="cal-heads">
        <div class="cal-head">Su</div><div class="cal-head">Mo</div>
        <div class="cal-head">Tu</div><div class="cal-head">We</div>
        <div class="cal-head">Th</div><div class="cal-head">Fr</div>
        <div class="cal-head">Sa</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <div class="section-label" id="hist-section-label">Workouts</div>
    <div class="card" style="padding:0" id="hist-list"></div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<nav class="nav">
    <button class="nav-btn active" id="nav-home" onclick="switchPage('home')">
        <div class="nav-icon">⊙</div>Home
    </button>
    <button class="nav-btn" id="nav-log" onclick="switchPage('log')">
        <div class="nav-icon" style="font-size:24px;font-weight:300">+</div>Log
    </button>
    <button class="nav-btn" id="nav-history" onclick="switchPage('history')">
        <div class="nav-icon">≡</div>History
    </button>
</nav>

<!-- ===== EXERCISE PICKER SHEET ===== -->
<div class="sheet-overlay" id="picker-overlay" onclick="closePicker(event)">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="picker-title">Add Exercise</div>
        <div class="custom-row">
            <input type="text" class="custom-input" id="custom-name" placeholder="Type a custom name...">
            <button class="custom-add" onclick="addCustomExercise()">Add</button>
        </div>
        <div class="sheet-section">Common exercises</div>
        <div id="picker-list"></div>
    </div>
</div>

<!-- ===== GROUP PICKER SHEET ===== -->
<div class="sheet-overlay" id="group-picker-overlay" onclick="closeGroupPicker(event)">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Add Another Group</div>
        <div class="muscle-grid" style="padding:16px;" id="group-picker-grid"></div>
    </div>
</div>

<!-- ===== WORKOUT DETAIL MODAL ===== -->
<div class="modal-overlay" id="detail-overlay" onclick="closeDetail(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-head">
            <div class="modal-title" id="detail-title"></div>
            <div class="modal-date" id="detail-date"></div>
        </div>
        <div id="detail-exercises"></div>
        <div style="height:10px"></div>
        <button class="modal-edit-btn" id="detail-edit-btn">Edit Workout</button>
        <button class="modal-del" id="detail-del-btn">Delete Workout</button>
    </div>
</div>

<!-- SNACKBAR -->
<div class="snackbar" id="snackbar"></div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────

const GROUPS = ['Chest', 'Lats', 'Legs', 'Arms', 'Shoulders'];

const COLORS = {
    Chest:     '#ff6b6b',
    Lats:      '#6badff',
    Legs:      '#c8f05a',
    Arms:      '#ffb26b',
    Shoulders: '#b26bff',
};

const PRESETS = {
    Chest: [
        'Dumbbell Bench Press',
        'Incline Dumbbell Bench',
        'Barbell Bench Press',
        'Decline Bench Press',
        'Cable Flies',
        'Dumbbell Flies',
        'Fly Machine / Pec Deck',
        'Chest Press Machine',
        'Reverse Flies',
        'Seated DB Military Press',
        'Standing DB Military Press',
        'Lateral Raises',
        'Tricep Press Downs',
    ],
    Lats: [
        'Lat Pulldowns',
        'Single Arm Rows',
        'Both Arm Rows',
        'Dumbbell Rows',
        'Seated Rows',
        'Pull-ups',
        'Lat Push Downs',
        'Dumbbell Curls',
        'Seated Dumbbell Curls',
        'Hammer Curls',
        'Reverse Flies',
    ],
    Legs: [
        'Leg Press',
        'Leg Curls',
        'Leg Extensions',
        'Squats',
        'Smith Machine Squats',
        'Goblet Squats',
        'Lunges',
        'Leg Raises',
    ],
    Arms: [
        'Dumbbell Curls',
        'Seated Dumbbell Curls',
        'Hammer Curls',
        'Tricep Press Downs',
        'Rope Push Downs',
        'Tricep Machine Push Down',
        'Barbell Curls',
    ],
    Shoulders: [
        'Seated DB Military Press',
        'Standing DB Military Press',
        'Lateral Raises',
        'Reverse Flies',
        'Shoulder Press Machine',
        'Smith Machine Military Press',
        'Rear Deltoid Cable Flies',
        'Side Lateral Cable Raise',
    ],
};

const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

// ─── Storage ─────────────────────────────────────────────────────────────────

function load() {
    try {
        const data = JSON.parse(localStorage.getItem('lifts') || '[]');
        return data.map(w => ({ ...w, muscleGroups: w.muscleGroups || [w.muscleGroup] }));
    } catch { return []; }
}
function save(data) { localStorage.setItem('lifts', JSON.stringify(data)); }
function addWorkoutToStore(w) { const d = load(); d.push(w); save(d); }
function deleteById(id) { save(load().filter(w => w.id !== id)); }

// ─── State ───────────────────────────────────────────────────────────────────

let currentPage = 'home';
let active = null;         // in-progress workout
let editingId = null;      // id of workout being edited (null = new)
let histDate = new Date(); // month shown in history
let detailId = null;       // workout open in detail modal

// ─── Utilities ───────────────────────────────────────────────────────────────

function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

function dateStrToObj(s) {
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
}

function longDate(s) {
    const [y,m,d] = s.split('-').map(Number);
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return `${days[new Date(y,m-1,d).getDay()]}, ${MONTHS[m-1]} ${d}`;
}

function shortDate(s) {
    const [y,m,d] = s.split('-').map(Number);
    return `${MONTHS[m-1]} ${d}`;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

let _snackT;
function snack(msg) {
    const el = document.getElementById('snackbar');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_snackT);
    _snackT = setTimeout(() => el.classList.remove('show'), 2400);
}

// ─── Navigation ──────────────────────────────────────────────────────────────

function switchPage(pg) {
    currentPage = pg;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`page-${pg}`).classList.add('active');
    document.getElementById(`nav-${pg}`).classList.add('active');
    if (pg === 'home') renderHome();
    else if (pg === 'log') renderLog();
    else if (pg === 'history') renderHistory();
}

function goToLog() { switchPage('log'); }

// ─── Home ─────────────────────────────────────────────────────────────────────

function renderHome() {
    const now = new Date();
    document.getElementById('home-date').textContent =
        now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

    const data = load();
    const today = todayStr();

    // Days since last lift
    const dates = [...new Set(data.map(w => w.date))].sort().reverse();
    if (dates.length === 0) {
        document.getElementById('days-num').textContent = '—';
        document.getElementById('days-label').textContent = 'no lifts recorded';
    } else {
        const diff = Math.round((dateStrToObj(today) - dateStrToObj(dates[0])) / 86400000);
        document.getElementById('days-num').textContent = diff;
        document.getElementById('days-label').textContent =
            diff === 0 ? 'lifted today — keep it up' :
            diff === 1 ? 'day since last lift' : 'days since last lift';
    }

    // Month count
    const mStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
    const mCount = data.filter(w => w.date.startsWith(mStr)).length;
    document.getElementById('month-num').textContent = mCount;
    document.getElementById('month-label').textContent = `lift${mCount !== 1 ? 's' : ''} in ${MONTHS[now.getMonth()]}`;

    // Week row (Mon–Sun)
    const weekEl = document.getElementById('week-row');
    const dow = now.getDay();
    const monOffset = (dow + 6) % 7;
    const mon = new Date(now); mon.setDate(now.getDate() - monOffset);
    const hitDates = new Set(data.map(w => w.date));
    const dayNames = ['Mo','Tu','We','Th','Fr','Sa','Su'];
    weekEl.innerHTML = Array.from({length:7}, (_,i) => {
        const d = new Date(mon); d.setDate(mon.getDate() + i);
        const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        const hit = hitDates.has(ds);
        const todayRing = ds === today;
        return `<div class="week-day">
            <div class="wdn">${dayNames[i]}</div>
            <div class="wdd ${hit?'hit':''} ${todayRing&&!hit?'today-ring':''} ${todayRing&&hit?'today-ring':''}">${d.getDate()}</div>
        </div>`;
    }).join('');

    // Recent list
    const recent = [...data].sort((a,b) => b.date.localeCompare(a.date)).slice(0,10);
    const listEl = document.getElementById('recent-list');
    if (recent.length === 0) {
        listEl.innerHTML = `<div class="empty"><div class="empty-title">No workouts yet</div><div class="empty-sub">Log your first lift above</div></div>`;
    } else {
        listEl.innerHTML = recent.map(w => workoutRow(w)).join('');
    }

    // Log button text
    document.getElementById('home-log-btn').textContent =
        hitDates.has(today) ? '+ Log Another Workout' : "+ Log Today's Workout";
}

function workoutDisplayName(w) {
    return (w.muscleGroups || [w.muscleGroup]).join(' + ');
}

function workoutRow(w) {
    const sets = w.exercises.reduce((s,e) => s + (e.sets?.length || 0), 0);
    const c = COLORS[w.muscleGroup] || '#888';
    return `<div class="workout-row" onclick="openDetail('${w.id}')">
        <div>
            <div class="wr-group"><span class="muscle-dot" style="background:${c}"></span>${workoutDisplayName(w)}</div>
            <div class="wr-date">${longDate(w.date)}</div>
            <div class="wr-detail">${w.exercises.length} exercise${w.exercises.length!==1?'s':''} · ${sets} set${sets!==1?'s':''}</div>
        </div>
        <div class="wr-arrow">›</div>
    </div>`;
}

// ─── Log ──────────────────────────────────────────────────────────────────────

function renderLog() {
    if (active) showStepB();
    else showStepA();
}

function showStepA() {
    document.getElementById('log-step-a').style.display = 'block';
    document.getElementById('log-step-b').style.display = 'none';

    const di = document.getElementById('workout-date');
    if (!di.value) di.value = todayStr();

    const data = load();
    document.getElementById('muscle-grid').innerHTML = GROUPS.map(g => {
        const cnt = data.filter(w => w.muscleGroup === g).length;
        return `<div class="muscle-tile" onclick="pickGroup('${g}')">
            <div class="mt-bar bar-${g.toLowerCase()}"></div>
            <div class="mt-name">${g}</div>
            <div class="mt-sub">${cnt} lifetime session${cnt!==1?'s':''}</div>
        </div>`;
    }).join('');
}

function pickGroup(g) {
    const date = document.getElementById('workout-date').value || todayStr();
    if (active) {
        active.muscleGroup = g;
        active.muscleGroups = [g];
        active.date = date;
    } else {
        active = { id: uid(), date, muscleGroup: g, muscleGroups: [g], exercises: [] };
    }
    showStepB();
}

function showStepB() {
    document.getElementById('log-step-a').style.display = 'none';
    document.getElementById('log-step-b').style.display = 'block';
    updateLogTitle();
    document.getElementById('log-subtitle').textContent = longDate(active.date);
    document.getElementById('hdr-cancel-btn').textContent = editingId ? 'Cancel' : '← Back';
    document.getElementById('hdr-save-btn').textContent = editingId ? 'Update' : 'Save';
    renderGroupPills();
    renderCards();
}

function updateLogTitle() {
    const groups = active.muscleGroups || [active.muscleGroup];
    document.getElementById('log-title').textContent =
        groups.length === 1 ? groups[0] + ' Day' : groups.join(' + ');
}

function renderGroupPills() {
    const groups = active.muscleGroups || [active.muscleGroup];
    const allSelected = groups.length >= GROUPS.length;
    document.getElementById('group-pills').innerHTML =
        groups.map(g => `<span class="group-pill">
            <span class="gp-dot" style="background:${COLORS[g]||'#888'}"></span>${g}
        </span>`).join('') +
        (allSelected ? '' : `<button class="add-group-pill" onclick="openGroupPicker()">+ group</button>`);
}

function openGroupPicker() {
    const current = active.muscleGroups || [active.muscleGroup];
    const available = GROUPS.filter(g => !current.includes(g));
    document.getElementById('group-picker-grid').innerHTML = available.map(g =>
        `<div class="muscle-tile" onclick="addGroup('${g}')">
            <div class="mt-bar bar-${g.toLowerCase()}"></div>
            <div class="mt-name">${g}</div>
        </div>`
    ).join('');
    document.getElementById('group-picker-overlay').classList.add('open');
}

function closeGroupPicker(e) {
    document.getElementById('group-picker-overlay').classList.remove('open');
}

function addGroup(g) {
    if (!active.muscleGroups) active.muscleGroups = [active.muscleGroup];
    if (!active.muscleGroups.includes(g)) active.muscleGroups.push(g);
    closeGroupPicker();
    updateLogTitle();
    renderGroupPills();
}

function cancelLog() {
    if (editingId) {
        editingId = null;
        active = null;
        switchPage('home');
    } else {
        showStepA();
    }
}

function renderCards() {
    const el = document.getElementById('ex-cards');
    if (active.exercises.length === 0) {
        el.innerHTML = `<div class="empty" style="padding:28px 20px 12px"><div class="empty-title">No exercises yet</div><div class="empty-sub">Tap + Add Exercise below</div></div>`;
        return;
    }
    el.innerHTML = active.exercises.map((ex, ei) => {
        const setRows = ex.sets.map((s, si) => `
            <div class="set-row">
                <div class="set-num">${si+1}</div>
                <input class="set-inp" type="number" inputmode="decimal" placeholder="lbs"
                    value="${s.weight ?? ''}"
                    oninput="setVal(${ei},${si},'weight',this.value)">
                <span class="set-times">×</span>
                <input class="set-inp" type="number" inputmode="numeric" placeholder="reps"
                    value="${s.reps ?? ''}"
                    oninput="setVal(${ei},${si},'reps',this.value)">
                <button class="set-del" onclick="delSet(${ei},${si})">×</button>
            </div>`).join('');
        return `<div class="ex-card">
            <div class="ec-header">
                <div class="ec-name">${ex.name}</div>
                <button class="ec-remove" onclick="delEx(${ei})">×</button>
            </div>
            <div class="sets-head">
                <span class="sh sh-num">Set</span>
                <span class="sh sh-w">Weight</span>
                <span class="sh sh-x">×</span>
                <span class="sh sh-r">Reps</span>
                <span class="sh-del"></span>
            </div>
            ${setRows}
            <div class="add-set-row">
                <button class="add-set-btn" onclick="addSet(${ei})">+ Add Set</button>
            </div>
        </div>`;
    }).join('');
}

function setVal(ei, si, field, val) {
    const n = parseFloat(val);
    active.exercises[ei].sets[si][field] = isNaN(n) ? null : n;
}

function addSet(ei) {
    const sets = active.exercises[ei].sets;
    const prev = sets.length ? sets[sets.length-1] : {};
    sets.push({ weight: prev.weight ?? null, reps: prev.reps ?? null });
    renderCards();
    // focus the new weight input
    setTimeout(() => {
        const cards = document.querySelectorAll('.ex-card');
        if (cards[ei]) {
            const rows = cards[ei].querySelectorAll('.set-row');
            const inp = rows[rows.length-1]?.querySelector('.set-inp');
            inp?.focus(); inp?.select();
        }
    }, 60);
}

function delSet(ei, si) {
    active.exercises[ei].sets.splice(si, 1);
    renderCards();
}

function delEx(ei) {
    active.exercises.splice(ei, 1);
    renderCards();
}

function addExByName(name) {
    active.exercises.push({ name, sets: [] });
    renderCards();
    addSet(active.exercises.length - 1);
}

function finishWorkout() {
    if (!active) return;
    if (active.exercises.length === 0) { snack('Add at least one exercise'); return; }
    active.exercises.forEach(e => {
        e.sets = e.sets.filter(s => s.weight !== null || s.reps !== null);
    });
    if (!active.muscleGroups) active.muscleGroups = [active.muscleGroup];
    active.muscleGroup = active.muscleGroups[0];

    if (editingId) {
        save(load().map(w => w.id === editingId ? active : w));
        editingId = null;
        snack('Workout updated!');
    } else {
        addWorkoutToStore(active);
        snack('Workout saved!');
    }
    active = null;
    switchPage('home');
}

// ─── Picker Sheet ─────────────────────────────────────────────────────────────

function openPicker() {
    const groups = active.muscleGroups || [active.muscleGroup];
    document.getElementById('picker-title').textContent = 'Add Exercise';
    document.getElementById('custom-name').value = '';

    const multiGroup = groups.length > 1;
    let html = '';
    groups.forEach(g => {
        if (multiGroup) {
            html += `<div class="sheet-section" style="color:${COLORS[g]||'var(--text3)'}">${g}</div>`;
        }
        (PRESETS[g] || []).forEach(name => {
            html += `<button class="picker-btn" data-name="${name.replace(/"/g,'&quot;')}" onclick="pickPreset(this)">
                <span>${name}</span><span class="picker-plus">+</span>
            </button>`;
        });
    });
    document.getElementById('picker-list').innerHTML = html;
    document.getElementById('picker-overlay').classList.add('open');
}

function closePicker(e) { document.getElementById('picker-overlay').classList.remove('open'); }

function pickPreset(btn) {
    addExByName(btn.dataset.name);
    closePicker();
}

function addCustomExercise() {
    const name = document.getElementById('custom-name').value.trim();
    if (!name) return;
    addExByName(name);
    closePicker();
}

// ─── Detail Modal ─────────────────────────────────────────────────────────────

function openDetail(id) {
    const w = load().find(x => x.id === id);
    if (!w) return;
    detailId = id;

    document.getElementById('detail-title').textContent = workoutDisplayName(w);
    document.getElementById('detail-date').textContent = longDate(w.date);

    const exEl = document.getElementById('detail-exercises');
    if (!w.exercises?.length) {
        exEl.innerHTML = `<div style="padding:16px 20px;color:var(--text3);font-size:14px">No exercises recorded</div>`;
    } else {
        exEl.innerHTML = w.exercises.map(ex => {
            const setsHtml = ex.sets?.length
                ? ex.sets.map((s,i) => {
                    let txt = '';
                    if (s.weight != null && s.reps != null) txt = `${s.weight} lbs × ${s.reps} reps`;
                    else if (s.weight != null) txt = `${s.weight} lbs`;
                    else if (s.reps != null) txt = `${s.reps} reps`;
                    else txt = '—';
                    return `<div class="me-set"><span class="me-sn">Set ${i+1}</span><span class="me-sd">${txt}</span></div>`;
                }).join('')
                : `<div style="color:var(--text3);font-size:13px">No sets logged</div>`;
            return `<div class="modal-ex"><div class="me-name">${ex.name}</div>${setsHtml}</div>`;
        }).join('');
    }

    document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail(e) {
    document.getElementById('detail-overlay').classList.remove('open');
    detailId = null;
}

document.getElementById('detail-edit-btn').addEventListener('click', () => {
    if (!detailId) return;
    const w = load().find(x => x.id === detailId);
    if (!w) return;
    editingId = detailId;
    active = JSON.parse(JSON.stringify(w));
    if (!active.muscleGroups) active.muscleGroups = [active.muscleGroup];
    closeDetail(null);
    switchPage('log');
    showStepB();
});

document.getElementById('detail-del-btn').addEventListener('click', () => {
    if (!detailId) return;
    if (confirm('Delete this workout?')) {
        deleteById(detailId);
        closeDetail();
        if (currentPage === 'home') renderHome();
        else if (currentPage === 'history') renderHistory();
        snack('Workout deleted');
    }
});

// ─── History ──────────────────────────────────────────────────────────────────

function renderHistory() {
    const y = histDate.getFullYear(), m = histDate.getMonth();
    document.getElementById('cal-label').textContent = `${MONTHS[m]} ${y}`;
    document.getElementById('hist-section-label').textContent = `${MONTHS[m]} Workouts`;

    const data = load();
    const today = todayStr();
    const byDate = {};
    data.forEach(w => { (byDate[w.date] = byDate[w.date] || []).push(w); });

    const firstDow = new Date(y, m, 1).getDay();
    const daysInM = new Date(y, m+1, 0).getDate();

    let cells = Array(firstDow).fill('<div class="cal-cell"></div>');
    for (let d = 1; d <= daysInM; d++) {
        const ds = `${y}-${pad(m+1)}-${pad(d)}`;
        const hit = !!byDate[ds];
        const isToday = ds === today;
        let cls = 'cal-cell' + (hit?' has-workout':'') + (isToday?' is-today':'');
        const onclick = hit ? `onclick="openDetailForDate('${ds}')"` : '';
        cells.push(`<div class="${cls}" ${onclick}>${d}</div>`);
    }
    document.getElementById('cal-grid').innerHTML = cells.join('');

    // List
    const mWorkouts = data
        .filter(w => { const [wy,wm] = w.date.split('-').map(Number); return wy===y && wm===m+1; })
        .sort((a,b) => b.date.localeCompare(a.date));

    const listEl = document.getElementById('hist-list');
    if (mWorkouts.length === 0) {
        listEl.innerHTML = `<div class="empty"><div class="empty-title">No workouts this month</div><div class="empty-sub">Navigate months or log one now</div></div>`;
    } else {
        listEl.innerHTML = mWorkouts.map(w => workoutRow(w)).join('');
    }
}

function openDetailForDate(ds) {
    const w = load().filter(x => x.date === ds);
    if (w.length) openDetail(w[0].id);
}

function shiftMonth(delta) {
    histDate.setMonth(histDate.getMonth() + delta);
    renderHistory();
}

// ─── Init ─────────────────────────────────────────────────────────────────────

document.getElementById('workout-date').value = todayStr();
renderHome();
</script>
</body>
</html>
